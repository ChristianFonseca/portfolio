services:
  portfolio-web:
    build: .
    container_name: portfolio-web
    restart: unless-stopped
    env_file: .env
    environment:
      UPLOADS_DIR: /data/uploads
    ports: ["127.0.0.1:8001:3000"]
    # Endurecimiento: limita el radio de un futuro RCE
    read_only: true                 # sistema de archivos de solo lectura
    security_opt:
      - no-new-privileges:true      # no se pueden escalar privilegios (setuid)
    cap_drop:
      - ALL                         # sin capabilities de Linux (Next no las necesita)
    volumes:
      - /var/lib/portfolio/uploads:/data/uploads   # subidas (validadas como imagen)
      # Únicas rutas escribibles, en RAM y efímeras (se pierden al reiniciar):
      - type: tmpfs
        target: /tmp
        tmpfs: { mode: 01777, size: 67108864 }
      - type: tmpfs
        target: /app/.next/cache
        tmpfs: { mode: 01777, size: 134217728 }
    networks: [portfolio-net, pg-shared]

networks:
  portfolio-net: { name: portfolio-net }
  pg-shared: { external: true }
